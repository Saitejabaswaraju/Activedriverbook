<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Phone Book — Chakra E-Trans</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a4d40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Driver Book">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#0b1f1c;
    --paper:#f6f8f7;
    --panel:#ffffff;
    --line:#dde5e2;
    --teal:#0f6e5c;
    --teal-dark:#0a4d40;
    --teal-tint:#e4f2ee;
    --amber:#c9821a;
    --amber-tint:#fbf0dd;
    --grey:#8a9791;
    --danger:#b3412e;
    --danger-tint:#f7e9e5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    background:var(--teal-dark);
    color:#eef7f4;
    padding:22px 18px 68px;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.10), transparent 70%);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#9fd6c6;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#4fe3b8;box-shadow:0 0 0 3px rgba(79,227,184,.25);}
  h1{
    margin:8px 0 2px;
    font-size:26px;
    font-weight:800;
    letter-spacing:-.02em;
  }
  .sub{
    font-size:13.5px;
    color:#bcded4;
    margin:0;
  }

  /* ---------- search card (overlaps header) ---------- */
  .search-wrap{
    max-width:760px;
    margin:-46px auto 0;
    padding:0 14px;
    position:relative;
    z-index:5;
  }
  .search-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 10px 26px -12px rgba(10,40,33,.28);
    padding:12px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .search-card svg{flex:0 0 auto; color:var(--grey);}
  .search-card input{
    border:none;
    outline:none;
    flex:1;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:transparent;
    min-width:0;
  }
  .search-card input::placeholder{color:#a7b3ae;}
  .clear-btn{
    border:none;
    background:var(--paper);
    color:var(--grey);
    width:26px;height:26px;
    border-radius:50%;
    font-size:14px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .clear-btn.show{display:flex;}

  /* ---------- tabs ---------- */
  .tabs{
    max-width:760px;
    margin:14px auto 0;
    padding:0 14px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.01em;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:#5b6b65;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
    transition:background .12s,color .12s,border-color .12s;
  }
  .tab .n{
    font-weight:700;
    background:var(--paper);
    padding:1px 6px;
    border-radius:999px;
    font-size:11px;
  }
  .tab.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .tab.active .n{background:rgba(255,255,255,.22); color:#fff;}

  /* ---------- list ---------- */
  main{
    max-width:760px;
    margin:0 auto;
    padding:14px 14px 60px;
  }
  .count-row{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--grey);
    padding:4px 4px 10px;
    letter-spacing:.03em;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 12px 12px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar{
    flex:0 0 auto;
    width:40px;height:40px;
    border-radius:10px;
    background:var(--teal-tint);
    color:var(--teal-dark);
    font-weight:700;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:.02em;
  }
  .info{flex:1; min-width:0;}
  .name{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:#6c7a75;
    margin-top:2px;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .meta .mob{color:var(--teal-dark); font-weight:600;}
  .badge{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.05em;
    padding:2px 7px;
    border-radius:999px;
    text-transform:uppercase;
  }
  .badge.active{background:var(--teal-tint); color:var(--teal-dark);}
  .badge.inactive{background:var(--amber-tint); color:var(--amber);}
  .badge.terminated{background:var(--danger-tint); color:var(--danger);}
  .badge.others{background:#eee; color:#777;}

  .actions{
    flex:0 0 auto;
    display:flex;
    gap:8px;
  }
  .call-btn{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    box-shadow:0 4px 10px -4px rgba(15,110,92,.55);
    transition:transform .1s, background .12s;
  }
  .call-btn:active{transform:scale(.92); background:var(--teal-dark);}
  .whatsapp-btn{
    width:42px;height:42px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    box-shadow:0 4px 10px -4px rgba(37,211,102,.55);
    transition:transform .1s, background .12s;
  }
  .whatsapp-btn:active{transform:scale(.92); background:#1eb857;}

  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--grey);
  }
  .empty svg{opacity:.4; margin-bottom:10px;}
  .empty p{margin:0; font-size:14px;}

  @media (max-width:420px){
    h1{font-size:22px;}
    .name{font-size:14px;}
  }
</style>
</head>

let query = '';

const listEl = document.getElementById('list');
const countRowEl = document.getElementById('countRow');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderList(){
  const q = query.trim().toLowerCase();
  let filtered = DRIVERS.slice();
  if(q){
    filtered = filtered.filter(d =>
      (d.name||'').toLowerCase().includes(q) ||
      (d.mobile||'').includes(q) ||
      (d.id||'').toLowerCase().includes(q)
    );
  }

  countRowEl.textContent = q ? `${filtered.length} of ${DRIVERS.length} drivers` : `${DRIVERS.length} active drivers`;

  if(filtered.length===0){
    listEl.innerHTML = `
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <p>No drivers match your search.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(d => {
    return `
    <div class="card">
      <div class="avatar">${initials(d.name)}</div>
      <div class="info">
        <div class="name">${escapeHtml(d.name)}</div>
        <div class="meta">
          <span class="mob">${escapeHtml(d.mobile)}</span>
          <span>&middot; ID ${escapeHtml(d.id)}</span>
        </div>
      </div>
      <div class="actions">
        <a class="call-btn" href="tel:${escapeHtml(d.mobile)}" title="Call ${escapeHtml(d.name)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
        </a>

  }).join('');

searchInput.addEventListener('input', (e)=>{

  clearBtn.classList.toggle('show', query.length>0);
  renderList();
});

  searchInput.value='';
  query='';
  clearBtn.classList.remove('show');
  searchInput.focus();
  renderList();
});

renderList();
